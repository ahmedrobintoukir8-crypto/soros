<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>সরস - কৃষকের ফ্রেশ পণ্য</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root{
    --green:#198754;
    --dark-green:#116530;
    --light-green:#eaf7ed;
    --yellow:#ffc107;
    --orange:#ff9800;
    --red:#dc3545;
    --dark:#222;
    --gray:#666;
    --light:#f5f8f5;
    --white:#fff;
    --border:#e5e5e5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Hind Siliguri',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--light);
    color:var(--dark);
    line-height:1.6;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:white;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:10px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-logo{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--green);
}

.logo-area h1{
    color:var(--green);
    font-size:27px;
    font-weight:700;
}

/* LANGUAGE SWITCHER */

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.language-switcher{
    display:flex;
    background:#f1f5f1;
    border:1px solid #dce5dc;
    border-radius:25px;
    padding:3px;
}

.language-switcher button{
    border:none;
    background:transparent;
    padding:6px 11px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    color:#555;
    transition:.2s;
}

.language-switcher button.active{
    background:var(--green);
    color:white;
}

.cart-btn{
    border:none;
    background:var(--green);
    color:white;
    padding:10px 17px;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
    display:flex;
    gap:8px;
    align-items:center;
    transition:.2s;
}

.cart-btn:hover{
    background:var(--dark-green);
    transform:translateY(-1px);
}

/* HERO */

.hero{
    min-height:360px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:50px 20px;

    background:
    linear-gradient(rgba(18,101,48,.78),rgba(18,101,48,.78)),
    url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1400&q=85");

    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:750px;
    color:white;
}

.hero h2{
    font-size:42px;
    margin-bottom:8px;
    font-weight:700;
}

.hero p{
    font-size:19px;
    margin-bottom:22px;
}

.hero-btn{
    display:inline-block;
    background:var(--yellow);
    color:#222;
    padding:11px 25px;
    border-radius:30px;
    text-decoration:none;
    font-weight:700;
    font-size:17px;
    transition:.2s;
}

.hero-btn:hover{
    background:#ffca2c;
    transform:translateY(-2px);
}

/* TRUST */

.trust-section{
    max-width:1100px;
    margin:-35px auto 35px;
    position:relative;
    padding:0 15px;
}

.trust-grid{
    background:white;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    overflow:hidden;
}

.trust-item{
    padding:20px 10px;
    text-align:center;
    border-right:1px solid #eee;
}

.trust-item:last-child{
    border:none;
}

.trust-item i{
    color:var(--green);
    font-size:26px;
    margin-bottom:6px;
}

.trust-item strong{
    display:block;
    font-size:16px;
}

.trust-item span{
    font-size:13px;
    color:var(--gray);
}

/* PRODUCTS */

.container{
    max-width:1200px;
    margin:auto;
    padding:0 18px 40px;
}

.section-title{
    text-align:center;
    color:var(--dark-green);
    font-size:30px;
    margin-bottom:25px;
}

.section-subtitle{
    text-align:center;
    color:#777;
    margin-top:-18px;
    margin-bottom:30px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    transition:.25s;
    position:relative;
}

.product-card:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.product-img-box{
    height:220px;
    background:#f8f8f8;
    position:relative;
    overflow:hidden;
}

.product-img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}

.product-card:hover .product-img{
    transform:scale(1.04);
}

.product-badge{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--green);
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.product-info{
    padding:16px;
}

.product-title{
    font-size:19px;
    font-weight:700;
    margin-bottom:5px;
}

.product-description{
    color:#777;
    font-size:13px;
    min-height:22px;
}

.product-bottom{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.product-price{
    color:var(--green);
    font-size:21px;
    font-weight:700;
}

.price-unit{
    font-size:12px;
    color:#777;
    font-weight:400;
}

.add-to-cart{
    border:none;
    background:var(--yellow);
    color:#222;
    padding:9px 13px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.add-to-cart:hover{
    background:var(--orange);
}

/* CART */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:1999;
}

.overlay.show{
    display:block;
}

.cart-modal{
    position:fixed;
    top:0;
    right:-430px;
    width:390px;
    max-width:94%;
    height:100vh;
    background:white;
    z-index:2000;
    box-shadow:-5px 0 25px rgba(0,0,0,.15);
    transition:.3
